[project]
name = "neuralpet"
version = "0.1.0"
description = "Mushroom-body connectome pet: wiring vs. matched controls for associative learning"
authors = [
    { name = "hoeio", email = "woobin3069@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "certifi>=2026.10.23",
    "matplotlib>=3.11.2",
    "numba>=0.68.1",
    "numpy>=2.5.4",
    "pandas>=3.1.1",
    "pyarrow>=26.0.1",
    "scipy>=1.18.1",
]

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"
